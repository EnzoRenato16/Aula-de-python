# Local development services. Usage: docker compose up -d
services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: raiox
      POSTGRES_PASSWORD: raiox_dev_only
      POSTGRES_DB: raiox
      TZ: America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - raiox-pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raiox -d raiox"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  raiox-pg:
