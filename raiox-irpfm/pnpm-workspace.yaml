packages:
  - packages/*
  - apps/*

# Supply-chain guard: never install a version published less than 3 days ago.
minimumReleaseAge: 4320

# Install scripts are denied by default. esbuild ships prebuilt binaries via
# optional dependencies; its postinstall only re-checks them, so it stays off.
# @ibm/plex-sans ships a telemetry postinstall: denied (fonts are plain files).
allowBuilds:
  esbuild: false
  "@ibm/plex-sans": false

# drizzle-kit still depends on @esbuild-kit/core-utils, which pins an esbuild
# affected by GHSA-67mh-4wv8-2f99 (dev-server CORS). Force the patched esbuild.
overrides:
  "@esbuild-kit/core-utils>esbuild": 0.28.2
