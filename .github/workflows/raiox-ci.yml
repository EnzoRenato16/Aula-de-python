name: raiox-irpfm CI

on:
  push:
    paths:
      - "raiox-irpfm/**"
      - ".github/workflows/raiox-ci.yml"
  pull_request:
    paths:
      - "raiox-irpfm/**"
      - ".github/workflows/raiox-ci.yml"

permissions:
  contents: read

concurrency:
  group: raiox-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: raiox-irpfm

jobs:
  check:
    name: lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: raiox-irpfm/.node-version

      - name: Install pnpm (version pinned in package.json)
        run: npm install -g "pnpm@$(node -p "require('./package.json').packageManager.split('@')[1]")"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (Biome)
        run: pnpm lint

      - name: Money guard (no floats in the engine)
        run: node scripts/check-no-float.mjs

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build
